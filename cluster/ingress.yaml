apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: charge-finder-ingress
  namespace: charge-finder
  annotations:
    # Keep staging while testing; switch to letsencrypt-prod once verified
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - group-12-m7011e-ltu.se
    secretName: charge-finder-tls
  rules:
  - host: group-12-m7011e-ltu.se
    http:
      paths:
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
      - path: /api/users
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 80
      - path: /api/chargers
        pathType: Prefix
        backend:
          service:
            name: charger-data-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
