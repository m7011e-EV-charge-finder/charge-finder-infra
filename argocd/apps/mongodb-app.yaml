apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: charge-finder-mongodb
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/m7011e-EV-charge-finder/charge-finder-infra.git
    targetRevision: main
    path: data/mongodb
  destination:
    server: https://kubernetes.default.svc
    namespace: charge-finder
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
