apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: charge-finder-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/m7011e-EV-charge-finder/charge-finder-infra.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
