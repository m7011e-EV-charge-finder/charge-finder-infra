apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: charge-finder
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    app: mongodb
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-config
  namespace: charge-finder
  labels:
    app: mongodb
data:
  MONGO_INITDB_DATABASE: "chargefinder"
  TZ: "Europe/Stockholm"
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: charge-finder
  labels:
    app: mongodb
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: 27017
  selector:
    app: mongodb
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-internal
  namespace: charge-finder
  labels:
    app: mongodb
spec:
  clusterIP: None
  ports:
    - port: 27017
      targetPort: 27017
  selector:
    app: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: charge-finder
  labels:
    app: mongodb
spec:
  serviceName: mongodb-internal
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      securityContext:
        fsGroup: 999
      initContainers:
        - name: init-db-dir
          image: mongo:7
          command: ["sh", "-c", "mkdir -p /data/db && chown -R 999:999 /data/db"]
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
      containers:
        - name: mongodb
          image: mongo:7
          imagePullPolicy: IfNotPresent
          args:
            - "--wiredTigerCacheSizeGB"
            - "0.35"
          ports:
            - containerPort: 27017
          envFrom:
            - configMapRef:
                name: mongodb-config
            - secretRef:
                name: mongodb-credentials
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-pvc
